name: Build DDumper dylib

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'ci-logs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Verify
        run: |
          file build/DDumper.dylib
          otool -L build/DDumper.dylib
          otool -l build/DDumper.dylib | grep -A2 LC_ENCRYPTION_INFO || true
          codesign -dv build/DDumper.dylib 2>&1 | head -5

      # Sandbox agi Azure blob'u engelledigi icin loglar branch'e yazilir
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          cp build.log "ci-logs/build-$(date +%s).log"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: derleme logu [skip ci]"
          git push

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDumper-dylib
          path: build/DDumper.dylib
          if-no-files-found: error
