name: Build DDumper dylib

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDumper-dylib
          path: build/DDumper.dylib
          if-no-files-found: error
